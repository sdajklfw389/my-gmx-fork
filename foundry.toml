[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Increase contract size limit for large contracts like GMX
contract_size_limit = 100000

# Increase gas limit for deployment
gas_limit = 300000000

# Enable optimizer for large contracts
optimizer = true
optimizer_runs = 200

# Additional settings for large contracts
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
